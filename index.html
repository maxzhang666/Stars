<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star 书架</title>
  <meta name="description" content="我 star 过的 GitHub 仓库">
  <!-- 内联 SVG favicon：省一次请求，也免得控制台报 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.6-.8z' fill='%234f46e5'/%3E%3C/svg%3E">
  <!-- 内联脚本先跑，避免暗色用户看到白闪 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('stars-theme') || 'system';
        document.documentElement.classList.toggle('dark',
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="app.css">
</head>
<body class="min-h-dvh antialiased pb-10">
  <div id="app"></div>
  <!-- data.js 由 fetch_stars.py 生成并随站点一起发布 -->
  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
