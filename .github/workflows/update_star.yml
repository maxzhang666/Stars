name: Update Stars

on:
  schedule:
    - cron: '17 3 * * *'      # 每天 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write # 被调用工作流不能自行提权，必须写在这里

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # - uses: maxzhang666/OpsStar@main
      - uses: OpsUniverses/OpsStar@main
        with:
          actor: maxzhang666
          title: Stars
          desc: 我 star 过的 GitHub 仓库
          lang: zh-CN
          branch: gh-pages
